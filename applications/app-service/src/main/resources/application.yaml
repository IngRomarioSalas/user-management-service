server:
  port: 8080
spring:
  application:
    name: "user-management-service"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null

adapter:
  r2dbc-postgresql:
    host: localhost
    port: 5432
    database: userManagementService
    username: romario
    password: romario

management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"